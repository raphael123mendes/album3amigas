<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Amigas nas Arábias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#2b1238; --noite2:#3d1a4d; --areia:#f6e3bd; --acafrao:#f4a62a;
  --coral:#ee5a4b; --turquesa:#19b5b0; --texto:#fff7e6;
  --serif:'Alfa Slab One', Georgia, serif; --sans:'Nunito', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--texto); min-height:100vh;
  background:linear-gradient(180deg,#e9743f 0,#b13d62 18%,var(--noite2) 42%,var(--noite) 100%) fixed;
  padding-bottom:40px;
}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:36px 0 22px}
header h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,8vw,4.4rem);line-height:1.02;color:var(--areia);text-shadow:0 4px 0 #8a2d4e}
header p{margin-top:12px;font-size:1.05rem;opacity:.92}

.player{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center;margin:14px 0 34px}
.capa-grande{width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);background:#000}
.capa-grande img{width:100%;height:100%;object-fit:cover;display:block}
.agora small{display:inline-block;font-weight:800;color:#2b1238;background:var(--acafrao);padding:3px 12px;border-radius:99px;font-size:.8rem}
.agora h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.1;margin:12px 0 4px;color:var(--areia)}
.agora .sub{opacity:.85;margin-bottom:20px}
.barra{width:100%;height:10px;border-radius:99px;background:rgba(255,255,255,.18);cursor:pointer;position:relative;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acafrao);border-radius:99px}
.tempos{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;margin:6px 0 16px}
.ctrl{display:flex;align-items:center;gap:14px}
.ctrl button{border:0;cursor:pointer;color:#2b1238;background:var(--areia);width:52px;height:52px;border-radius:50%;font-size:1.2rem;display:grid;place-items:center}
.ctrl button.play{width:72px;height:72px;background:var(--acafrao);font-size:1.7rem}
.ctrl button:focus-visible,.faixa:focus-visible{outline:3px solid var(--turquesa);outline-offset:3px}
.aviso{display:none;margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(238,90,75,.25);font-size:.92rem}

h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--areia);margin-bottom:12px}
.lista{display:grid;gap:10px}
.faixa{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid transparent;background:rgba(255,255,255,.08);color:inherit;font:inherit;padding:8px;border-radius:12px;cursor:pointer}
.faixa:hover{background:rgba(255,255,255,.14)}
.faixa.ativa{border-color:var(--acafrao);background:rgba(244,166,42,.16)}
.faixa img{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:8px}
.faixa b{display:block;font-size:1.05rem}
.faixa span{font-size:.88rem;opacity:.8}
.tag{font-weight:800;font-size:.78rem;padding:4px 12px;border-radius:99px;color:#2b1238;white-space:nowrap}
.axe{background:#ffd23f}.sertanejo{background:#f0a56a}.rock{background:#ee5a4b}.reggae{background:#4fd1a5}

.letra-bloco{margin:0 0 34px}
.letra{height:340px;overflow-y:auto;padding:18px 18px 120px;border-radius:14px;background:rgba(0,0,0,.28);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.letra p{font-size:1.05rem;line-height:1.35;padding:7px 10px;margin:0;border-radius:8px;opacity:.55;cursor:pointer;transition:opacity .25s,color .25s,transform .25s;transform-origin:left center}
.letra p:hover{opacity:.85}
.letra p.passou{opacity:.4}
.letra p.agora-linha{opacity:1;color:var(--acafrao);font-weight:800;font-size:1.25rem;background:rgba(244,166,42,.12)}
.letra .rotulo{display:inline-block;font-size:.72rem;font-weight:800;color:#2b1238;background:var(--turquesa);padding:1px 8px;border-radius:99px;margin-right:8px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.letra{scroll-behavior:auto}}
@media (max-width:720px){.letra{height:300px}.letra p{font-size:1rem}.letra p.agora-linha{font-size:1.15rem}}
footer{text-align:center;margin-top:34px;opacity:.75;font-size:.9rem}

@media (max-width:720px){
  .player{grid-template-columns:1fr;gap:20px}
  .capa-grande{max-width:300px;margin:0 auto}
  .agora{text-align:center}
  .ctrl{justify-content:center}
  .faixa{grid-template-columns:56px 1fr}
  .faixa img{width:56px;height:56px}
  .faixa .tag{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3 Amigas<br>nas Arábias</h1>
    <p>Quatro músicas, três amigas e uma viagem inesquecível. Aperte o play!</p>
  </header>

  <section class="player" aria-label="Tocando agora">
    <div class="capa-grande"><img id="capa" alt="Capa da música"></div>
    <div class="agora">
      <small id="numero">Faixa 1 de 4</small>
      <h2 id="titulo"></h2>
      <p class="sub" id="sub"></p>
      <div class="barra" id="barra" role="slider" aria-label="Progresso da música"><i id="prog"></i></div>
      <div class="tempos"><span id="atual">0:00</span><span id="total">0:00</span></div>
      <div class="ctrl">
        <button id="ant" aria-label="Música anterior">&#9198;</button>
        <button id="play" class="play" aria-label="Tocar">&#9654;</button>
        <button id="prox" aria-label="Próxima música">&#9197;</button>
      </div>
      <div class="aviso" id="aviso">Não achei o arquivo desta música. Confira se o MP3 está na mesma pasta do site, com o nome certo.</div>
    </div>
  </section>

  <div class="letra-bloco">
    <h3>Letra</h3>
    <div class="letra" id="letra" aria-live="off"></div>
  </div>

  <h3>Todas as faixas</h3>
  <div class="lista" id="lista"></div>

  <footer>Feito com carinho para a família</footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>

dança, Kátia!", ""], [146, "Fecha essa mala, Rosiclér!", ""], [149, "Segura o Tchan das Arábias!", ""], [153, "Ralando o tchan nas dunas de Dubai!", "Refrão"], [158, "Esse trio de Curitiba ninguém segura mais!", ""], [162, "Sobe no camelo, mexe o quadril", ""], [166, "As amigas em Abu Dhabi são o charme do Brasil!", ""], [170, "Ali Babá! Ali Babá!", ""], [174, "Tira o casaco do frio e vem pra cá dançar!", ""], [178, "A mala não fecha não, gente! Chama a segurança do aeroporto!", ""]], [[0, "Trocaram o frio de Curitiba pelo calor do deserto...", "Fala"], [4, "Duas psicólogas e uma amiga tentando manter a calma...", ""], [8, "Mas quando o cartão passa no Dubai Mall, aí a sofrência é certa!", ""], [12, "Saíram lá de Curitiba com a mala cheia de ilusão", ""], [18, "Alúdima, Kátia e Rosiclér aterrissaram no mar de areia da região", ""], [24, "Coitado do casal que foi buscar no aeroporto", ""], [29, "Virou guia, motorista e fotógrafo... coitado, tá quase morto!", ""], [33, "Kátia e Rosiclér tentando analisar", ""], [36, "Se no calor de Abu Dhabi a mente vai pifar", ""], [38, "Olharam pro mar e bateu a dúvida cruel", ""], [42, "\"É Golfo de Omã ou Golfo Árabe que tá debaixo desse céu?\"", ""], [46, "Elas disseram: \"Ninguém sabe a diferença, mas se for chique a gente vai se jogar!\"", ""], [51, "E o camelo vai balançando e as costas vão doendo!", "Refrão"], [57, "No topo do Burj Khalifa meu queixo vai caindo!", ""], [63, "A Kátia e a Rosiclér na Mesquita tirando foto,", ""], [69, "E o zíper da minha mala estourando no sufoco!", ""], [73, "Ô coitado... o vendedor do shopping tá chorando no balcão,", ""], [78, "Esse trio de Curitiba quebrou meu coração!", ""], [83, "No Louvre de Abu Dhabi a arte é uma beleza,", ""], [88, "Mas no shopping de Dubai o cartão perde a cabeça!", ""], [93, "Compraram tanto presente, de lenço até souvenir,", ""], [97, "Que o zíper da rodinha tá prestes a pifá e desistir!", ""], [100, "A mala não fecha nem com três sentadas em cima,", ""], [102, "É a sofrência do excesso de bagagem nessa viagem de rotina!", ""], [103, "E o camelo vai balançando e as costas vão doendo!", "Refrão"], [108, "No topo do Burj Khalifa meu queixo vai caindo!", ""], [113, "A Kátia e a Rosiclér na Mesquita tirando foto,", ""], [118, "E o zíper da minha mala estourando no sufoco!", ""], [123, "Ô coitado... o vendedor do shopping tá chorando no balcão,", ""], [128, "Esse trio de Curitiba quebrou meu coração!", ""], [133, "Senta na mala, Alúdima... ajuda a fechar que o voo tá saindo!", ""]], [[0, "Atenção galera, as tias tão na área!", ""], [8, "Curitiba ficou pequena pras Arábias!", ""], [16, "Saíram lá de Curitiba pro calor sem fim", ""], [20, "Alúdima, Kátia e Rosiclér no avião assim", ""], [24, "Kátia e Rosiclér de humanas, mentes de divã", ""], [28, "Analisando os sheiks logo de manhã", ""], [32, "E o pobre do casal que foi lá receber", ""], [36, "Virou guia e motorista sem nem perceber", ""], [40, "Tira foto, carrega bolsa, vira o volante", ""], [44, "A vida de turista ali é bem estressante", ""], [48, "E a dúvida paira, no golfo azul", ""], [52, "Onde é que estamos? Norte ou Sul?", ""], [56, "Golfo Árabe ou Omã, que confusão total", ""], [60, "Mas o que importa é que o close é surreal", ""], [64, "Noites das Arábias, rock no deserto", "Refrão"], [68, "A mala não fecha e o caos tá por perto!", ""], [72, "Noites das Arábias, rock no deserto", ""], [76, "Andando de camelo, o horizonte tá certo!", ""], [112, "Mesquita, Louvre e o Burj Khalifa no céu", ""], [116, "A arquitetura foda tirou o chapéu", ""], [120, "Mas foi no shopping que o bicho pegou de verdade", ""], [124, "A gerente já tá chorando de tanta saudade", ""], [128, "O cartão de crédito já tá pedindo socorro", ""], [132, "E a Rosiclér me diz: \"Calma que eu não morro\"", ""], [136, "Mas a mala tá gorda, não quer mais fechar", ""], [140, "Quatro pessoas em cima pra tentar travar", ""], [144, "Noites das Arábias, rock no deserto", "Refrão"], [148, "A mala não fecha e o caos tá por perto!", ""], [152, "Noites das Arábias, rock no deserto", ""], [156, "Andando de camelo, o horizonte tá certo!", ""], [176, "E a mala ficou lá em Dubai! Tchau!", ""]], [[0, "Sente o ritmo... Kátia, Rosiclér e Alúdima nas Arábias.", ""], [6, "Olha o naipe dessas psicólogas!", ""], [12, "O sol de Dubai brilha forte no céu", ""], [16, "Visitaram a Mesquita e o Louvre, que véu!", ""], [20, "O Burj Khalífa é gigante e bonito", ""], [24, "E o trem pra Fujairá foi um lindo rito", ""], [28, "Kátia e Rosiclér de olho no sheik, atentas", ""], [32, "Analisando a mente dessas lendas!", ""], [36, "Na praia azul, batendo o mar", ""], [40, "Ficou a dúvida sem terminar:", ""], [44, "\"É Golfo Árabe ou Golfo de Omã?\"", ""], [46, "Rosiclér fala: \"Eu não sei, só quero meu suco de romã!\"", ""], [48, "Passeio no deserto ao pôr do sol", "Refrão"], [52, "No Dubai Mall o cartão chora sem dó!", ""], [56, "Bateu a maré alta, o estilo é de star", ""], [60, "As amigas de Curitiba vieram pra arrasar!", ""], [72, "Pegaram o camelo pra ver a paisagem", ""], [76, "E haja fôlego nessa viagem!", ""], [80, "Imagina caminhar três quilômetros neste mormaço", ""], [84, "Mas com esse pique, elas dão de braço!", ""], [88, "A mala não fecha, o zíper vai estourar", ""], [92, "E as amigas prontas pra festejar!", ""], [96, "Passeio no deserto ao pôr do sol", "Refrão"], [100, "No Dubai Mall o cartão chora sem dó!", ""], [104, "Bateu a maré alta, o estilo é de star", ""], [108, "As amigas de Curitiba vieram pra arrasar!", ""], [144, "Passeio no deserto ao pôr do sol", "Refrão"], [148, "No Dubai Mall o cartão chora sem dó!", ""], [152, "Bateu a maré alta, o estilo é de star", ""], [156, "As amigas de Curitiba vieram pra arrasar!", ""], [168, "E as amigas de Curitiba vieram pra arrasar...", ""], [172, "Dubai Mall... o cartão chora... as psicólogas... tchau, tchau!", ""]]];
const faixas = [
  {titulo:"Carnaval no Oriente", sub:"Mistura de Curitiba com as Arábias", estilo:"Axé", cls:"axe", arquivo:"carnaval-no-oriente.mp3", capa:"capas/carnaval-no-oriente.jpg"},
  {titulo:"O Zíper do Dubai Mall", sub:"Sofrência nas Arábias", estilo:"Sertanejo", cls:"sertanejo", arquivo:"o-ziper-do-dubai-mall.mp3", capa:"capas/o-ziper-do-dubai-mall.jpg"},
  {titulo:"A Mala Não Fecha", sub:"Desventura no Golfo", estilo:"Pop-Rock", cls:"rock", arquivo:"a-mala-nao-fecha.mp3", capa:"capas/a-mala-nao-fecha.jpg"},
  {titulo:"As Psicólogas e o Calor", sub:"Reggae tropical no Golfo", estilo:"Reggae Pop", cls:"reggae", arquivo:"as-psicologas-e-o-calor.mp3", capa:"capas/as-psicologas-e-o-calor.jpg"}
];
const $ = id => document.getElementById(id);
const audio = $('audio'); let i = 0;

$('lista').innerHTML = faixas.map((f,n)=>
  `<button class="faixa" data-n="${n}"><img src="${f.capa}" alt=""><div><b>${f.titulo}</b><span>${f.sub}</span></div><em class="tag ${f.cls}" style="font-style:normal">${f.estilo}</em></button>`
).join('');

function fmt(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); }

function carregar(n, tocar){
  i = (n+faixas.length)%faixas.length; const f = faixas[i];
  audio.src = f.arquivo;
  $('capa').src = f.capa; $('capa').alt = 'Capa de '+f.titulo;
  $('titulo').textContent = f.titulo; $('sub').textContent = f.sub+' · '+f.estilo;
  $('numero').textContent = 'Faixa '+(i+1)+' de '+faixas.length;
  $('aviso').style.display='none'; $('prog').style.width='0'; $('atual').textContent='0:00'; $('total').textContent='0:00';
  document.querySelectorAll('.faixa').forEach((b,k)=>b.classList.toggle('ativa',k===i));
  montarLetra();
  document.title = f.titulo+' · 3 Amigas nas Arábias';
  if(tocar) audio.play().catch(()=>{});
}

$('play').onclick = ()=> audio.paused ? audio.play().catch(()=>{}) : audio.pause();
$('prox').onclick = ()=> carregar(i+1, true);
$('ant').onclick = ()=> audio.currentTime>3 ? (audio.currentTime=0) : carregar(i-1, true);
$('lista').onclick = e => { const b=e.target.closest('.faixa'); if(b){ carregar(+b.dataset.n, true); window.scrollTo({top:0}); } };

audio.onplay = ()=>{ $('play').innerHTML='&#10074;&#10074;'; $('play').setAttribute('aria-label','Pausar'); };
audio.onpause = ()=>{ $('play').innerHTML='&#9654;'; $('play').setAttribute('aria-label','Tocar'); };
audio.onended = ()=> carregar(i+1, true);
audio.onerror = ()=>{ $('aviso').style.display='block'; };
audio.onloadedmetadata = ()=>{ $('total').textContent = fmt(audio.duration); };
audio.ontimeupdate = ()=>{ $('atual').textContent = fmt(audio.currentTime); if(audio.duration) $('prog').style.width = (audio.currentTime/audio.duration*100)+'%'; };
$('barra').onclick = e => { const r=$('barra').getBoundingClientRect(); if(audio.duration) audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; };

let linhaAtual=-1;
function montarLetra(){
  const L=LETRAS[i]||[];
  $('letra').innerHTML=L.map((l,k)=>`<p data-k="${k}">${l[2]?'<span class="rotulo">'+l[2]+'</span>':''}${l[1]}</p>`).join('');
  $('letra').scrollTop=0; linhaAtual=-1;
}
$('letra').onclick=e=>{const p=e.target.closest('p');if(!p)return;audio.currentTime=LETRAS[i][+p.dataset.k][0];audio.play().catch(()=>{});};
function atualizarLetra(){
  const L=LETRAS[i]||[],t=audio.currentTime;let k=-1;
  for(let n=0;n<L.length;n++){ if(L[n][0]<=t) k=n; else break; }
  if(k===linhaAtual) return; linhaAtual=k;
  const ps=$('letra').children;
  for(let n=0;n<ps.length;n++){ ps[n].classList.toggle('agora-linha',n===k); ps[n].classList.toggle('passou',n<k); }
  if(k>=0){ const p=ps[k],box=$('letra'); box.scrollTo({top:p.offsetTop-box.clientHeight/2+p.clientHeight/2}); }
}
audio.addEventListener('timeupdate',atualizarLetra);
audio.addEventListener('seeked',atualizarLetra);

carregar(0,false);
</script>
</body>
</html>
